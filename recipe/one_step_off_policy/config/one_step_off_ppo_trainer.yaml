hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

# config for the rollout (only for resource isolation)
rollout:
  # Number of nodes used in the rollout
  nnodes: 1
  # Number of GPUs per node
  n_gpus_per_node: 8

actor_rollout_ref:
  envs:
    n_rollouts: 32
    env_name: babyai
    task: BabyAI-MixedTrainLocal-v0/goto
    format_penalty: 0.0
    binary_reward: False
    use_nlp_metrics: False
    captioner:
      type: naive
      max_text_history: 1
      max_cot_history: 1
      max_image_history: 0
    babyai_kwargs:
      num_dists: 0
      # max_steps: 64
    babaisai_kwargs: 
      add_ruleset: True
    crafter_kwargs:
      area: [64, 64]              
      view: [9, 9]            
      size: [256, 256] # Image size in Crafter
      reward: True                       
      seed: null                  
      max_episode_steps: 2000  
    minihack_kwargs: 
      character: "@"
      max_episode_steps: 100
      penalty_step: -0.01         
      penalty_time: 0.0           
      penalty_mode: constant      
      savedir: null
      save_ttyrec_every: 0
      autopickup: False           
      skip_more: True
